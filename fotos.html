<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galeria de Fotos - Módulo do Javali</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 960px; margin: 30px auto; padding: 0 20px; background: #0d1117; color: #c9d1d9; }
    h1 { border-bottom: 1px solid #30363d; padding-bottom: 12px; font-size: 1.6rem; color: #f0f6fc; }
    .nav { margin-bottom: 20px; font-size: 1.1rem; }
    .nav a { color: #58a6ff; text-decoration: none; font-weight: 600; margin-right: 20px; padding: 8px 12px; background: #1f242c; border-radius: 6px; border: 1px solid #30363d; transition: 0.2s;}
    .nav a:hover { background: #30363d; color: #fff; }
    .viewer-container { background: #161b22; padding: 20px; border-radius: 8px; border: 1px solid #30363d; margin-bottom: 25px; text-align: center; }
    #photo-title { color: #58a6ff; margin-top: 0; font-size: 1.25rem; text-align: left; margin-bottom: 15px;}
    img#main-photo { max-width: 100%; border-radius: 6px; max-height: 70vh; object-fit: contain; }
    .selector-box { margin-bottom: 15px; text-align: left; }
    select { width: 100%; padding: 10px; background: #21262d; color: #c9d1d9; border: 1px solid #30363d; border-radius: 6px; font-size: 1rem; cursor: pointer; }
    .photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; list-style: none; padding: 0; margin-top: 20px; }
    .photo-card { background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 14px; cursor: pointer; transition: 0.2s; }
    .photo-card:hover, .photo-card.active { border-color: #58a6ff; background: #1f242c; }
    .photo-card h4 { margin: 0; font-size: 0.95rem; color: #c9d1d9; font-weight: 500; }
    .photo-card.active h4 { color: #58a6ff; }
  </style>
</head>
<body>
  <div class="nav">
    <a href="index.html">🎥 Ir para Vídeos</a>
    <a href="https://github.com/lucasaprc-jpg/projetos-videos-javali">📂 Voltar ao GitHub</a>
  </div>
  
  <h1>📸 Galeria de Fotos - Módulo do Javali</h1>
  
  <div class="viewer-container">
    <div class="selector-box">
      <label for="photo-select" style="font-weight: 600; display: block; margin-bottom: 8px;">Selecione a imagem:</label>
      <select id="photo-select" onchange="trocarFoto(this.value)"></select>
    </div>
    <h2 id="photo-title">Carregando...</h2>
    <img id="main-photo" src="" alt="Foto">
  </div>

  <h2>Lista de Imagens</h2>
  <ul class="photo-grid" id="gallery-list"></ul>

  <script>
    // 1. Injeta o arquivo de legendas diretamente no JavaScript
    const legendasRaw = `
NOVO-LAB_E9_A_F1.jpg \vert{}NOVO-LAB_E9_A_F1
NOVO-LAB_E9_A_F2.jpg \vert{}NOVO-LAB_E9_A_F2
NOVO-LAB_E9_A_F3.jpg \vert{}NOVO-LAB_E9_A_F3
NOVO-LAB_E9_BAT_F1 (1).jpg \vert{}NOVO-LAB_E9_BAT_F1 (1)
NOVO-LAB_E9_BAT_F2.jpg \vert{}NOVO-LAB_E9_BAT_F2
NOVO-LAB_E9_CA_F1.jpg \vert{}NOVO-LAB_E9_CA_F1
NOVO-LAB_E9_CA_F2.jpg \vert{}NOVO-LAB_E9_CA_F2
NOVO-LAB_E9_CHAVEUNI_PF.jpg \vert{}NOVO-LAB_E9_CHAVEUNI_PF
NOVO-LAB_E9_PINÇAS_PF.jpg \vert{}NOVO-LAB_E9_PINÇAS_PF
NOVO-LAB_E9_PINÇAS_PI.jpg \vert{}NOVO-LAB_E9_PINÇAS_PI
NOVO-LAB_E9_SA_F1.jpg \vert{}NOVO-LAB_E9_SA_F1
NOVO-LAB_E9_SA_F2.jpg \vert{}NOVO-LAB_E9_SA_F2
NOVO-LAB_E9_SA_F3.jpg \vert{}NOVO-LAB_E9_SA_F3
NOVO-LAB_E9_SA_F4.jpg \vert{}NOVO-LAB_E9_SA_F4
NOVO-LAB_E9__CHAVEUNI_PI.jpg \vert{}NOVO-LAB_E9__CHAVEUNI_PI
    `;

    // 3. Injeta apenas os nomes físicos reais dos arquivos
    const arquivosRestritos = [
      'NOVO-LAB_E9_A_F1.jpg',
      'NOVO-LAB_E9_A_F2.jpg',
      'NOVO-LAB_E9_A_F3.jpg',
      'NOVO-LAB_E9_BAT_F1 (1).jpg',
      'NOVO-LAB_E9_BAT_F2.jpg',
      'NOVO-LAB_E9_CA_F1.jpg',
      'NOVO-LAB_E9_CA_F2.jpg',
      'NOVO-LAB_E9_CHAVEUNI_PF.jpg',
      'NOVO-LAB_E9_PINÇAS_PF.jpg',
      'NOVO-LAB_E9_PINÇAS_PI.jpg',
      'NOVO-LAB_E9_SA_F1.jpg',
      'NOVO-LAB_E9_SA_F2.jpg',
      'NOVO-LAB_E9_SA_F3.jpg',
      'NOVO-LAB_E9_SA_F4.jpg',
      'NOVO-LAB_E9__CHAVEUNI_PI.jpg',
    ];

    const fotos = [];
    const mapLegendas = {};

    // Javascript lê o texto (livre de bugs do terminal do Windows)
    const linhas = legendasRaw.split('\n');
    for (let i = 0; i < linhas.length; i++) {
        let linha = linhas[i].trim();
        // Usa o código ASCII do Pipe para fugir do bug de cópia do chat
        if (linha.indexOf(String.fromCharCode(124)) !== -1) {
            let partes = linha.split(String.fromCharCode(124));
            let nomeBase = partes[0].trim().replace(/\.[^/.]+$/, "");
            let titulo = partes[1].trim();
            if (titulo) {
                mapLegendas[nomeBase] = titulo;
            }
        }
    }

    // Cruza os arquivos reais com as legendas (codifica url para funcionar 'Ç' e espaços)
    for (let i = 0; i < arquivosRestritos.length; i++) {
        let arquivo = arquivosRestritos[i];
        let id_tag = arquivo.replace(/\.[^/.]+$/, "");
        let titulo = mapLegendas[id_tag] ? mapLegendas[id_tag] : id_tag;
        
        fotos.push({
            id: id_tag,
            file: encodeURI('./fotos/' + arquivo),
            title: titulo
        });
    }

    const select = document.getElementById('photo-select');
    const list = document.getElementById('gallery-list');
    const viewer = document.getElementById('main-photo');
    const title = document.getElementById('photo-title');

    if (fotos.length > 0) {
        fotos.forEach((item, index) => {
          const opt = document.createElement('option');
          opt.value = item.id;
          opt.textContent = `${index + 1}. ${item.title}`;
          select.appendChild(opt);

          const li = document.createElement('li');
          li.className = 'photo-card';
          li.id = 'card-' + item.id;
          li.onclick = () => trocarFoto(item.id);
          li.innerHTML = `<h4>${index + 1}. ${item.title}</h4>`;
          list.appendChild(li);
        });

        function trocarFoto(id) {
          let item = fotos.find(v => v.id === id);
          if (!item) item = fotos[0];
          if (!item) return;

          window.location.hash = item.id;
          select.value = item.id;
          title.textContent = item.title;
          viewer.src = item.file;
          viewer.alt = item.title;
          window.scrollTo({ top: 0, behavior: 'smooth' });

          document.querySelectorAll('.photo-card').forEach(el => el.classList.remove('active'));
          const activeCard = document.getElementById('card-' + item.id);
          if (activeCard) activeCard.classList.add('active');
        }

        window.addEventListener('DOMContentLoaded', () => {
          let initialId = window.location.hash.replace('#', '');
          trocarFoto(initialId);
        });
        window.addEventListener('hashchange', () => {
          let hashId = window.location.hash.replace('#', '');
          trocarFoto(hashId);
        });
    } else {
        title.textContent = "Erro: Nenhuma foto encontrada na pasta.";
    }
  </script>
</body>
</html>
