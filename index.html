    .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; list-style: none; padding: 0; margin-top: 20px; }
    .video-card { background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 14px; cursor: pointer; transition: 0.2s; }
    .video-card:hover, .video-card.active { border-color: #58a6ff; background: #1f242c; }
    .video-card h4 { margin: 0; font-size: 0.95rem; color: #c9d1d9; font-weight: 500; }

    ];

    const select = document.getElementById('video-select');
    const list = document.getElementById('gallery-list');
    const player = document.getElementById('main-player');
    const title = document.getElementById('video-title');

    if (videos.length > 0) {
        videos.forEach((item, index) => {
          const opt = document.createElement('option');
          opt.value = item.id;
          opt.textContent = `${index + 1}. ${item.title}`;
          select.appendChild(opt);

          const li = document.createElement('li');
          li.className = 'video-card';
          li.id = 'card-' + item.id;
          li.onclick = () => trocarVideo(item.id);
          li.innerHTML = `<h4>${index + 1}. ${item.title}</h4>`;
          list.appendChild(li);
        });

        function trocarVideo(id) {
          let item = videos.find(v => v.id === id);
          if (!item) { item = videos[0]; }
          if (!item) { return; }

          window.location.hash = item.id;
          select.value = item.id;
          title.textContent = item.title;
          player.src = item.file;
          player.load();
          window.scrollTo({ top: 0, behavior: 'smooth' });

          document.querySelectorAll('.video-card').forEach(el => el.classList.remove('active'));
          const activeCard = document.getElementById('card-' + item.id);
          if (activeCard) { activeCard.classList.add('active'); }
        }

        window.addEventListener('DOMContentLoaded', () => {
          let initialId = window.location.hash.replace('#', '');
          trocarVideo(initialId);
        });

        window.addEventListener('hashchange', () => {
          let hashId = window.location.hash.replace('#', '');
          trocarVideo(hashId);
        });
    } else {
        title.textContent = "Erro: Nenhum vídeo configurado corretamente.";
