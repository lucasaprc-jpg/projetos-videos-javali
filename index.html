<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vídeos de Teste - Módulo do Javali</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 960px; margin: 30px auto; padding: 0 20px; background: #0d1117; color: #c9d1d9; }
    h1 { border-bottom: 1px solid #30363d; padding-bottom: 12px; font-size: 1.6rem; color: #f0f6fc; }
    .player-container { background: #161b22; padding: 20px; border-radius: 8px; border: 1px solid #30363d; margin-bottom: 25px; }
    #video-title { color: #58a6ff; margin-top: 0; font-size: 1.25rem; }
    video { width: 100%; border-radius: 6px; background: #000; outline: none; margin-top: 10px; max-height: 520px; }
    .selector-box { margin-bottom: 15px; }
    select { width: 100%; padding: 10px; background: #21262d; color: #c9d1d9; border: 1px solid #30363d; border-radius: 6px; font-size: 1rem; cursor: pointer; }
    .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; list-style: none; padding: 0; margin-top: 20px; }
    .video-card { background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 14px; cursor: pointer; transition: border-color 0.2s, background 0.2s; }
    .video-card:hover, .video-card.active { border-color: #58a6ff; background: #1f242c; }
    .video-card h4 { margin: 0; font-size: 0.95rem; color: #c9d1d9; font-weight: 500; }
    .video-card.active h4 { color: #58a6ff; }
  </style>
</head>
<body>
  <h1>🐗 Testes do Módulo do Javali</h1>
  <div class="player-container">
    <div class="selector-box">
      <label for="video-select" style="font-weight: 600; display: block; margin-bottom: 8px;">Selecione o ensaio para assistir:</label>
      <select id="video-select" onchange="trocarVideo(this.value)"></select>
    </div>
    <h2 id="video-title">Carregando...</h2>
    <video id="main-player" controls preload="metadata"></video>
  </div>
  <h2>Lista Completa de Ensaios</h2>
  <ul class="video-grid" id="gallery-list"></ul>
  <script>
    const videos = [
      { id: '20251117_091722', file: '20251117_091722.mp4', title: 'NOVO-LAB_E1_SA-ED_T01' },
      { id: '20251117_092432', file: '20251117_092432.mp4', title: 'NOVO-LAB_E1_SA-DE_T02' },
      { id: '20251117_092916', file: '20251117_092916.mp4', title: 'NOVO-LAB_E1_SA-ED_T03' },
      { id: '20251117_093103', file: '20251117_093103.mp4', title: 'NOVO-LAB_E1_SA-ED_T04' },
      { id: '20251117_093119', file: '20251117_093119.mp4', title: 'NOVO-LAB_E1_SA-ED_T05' },
      { id: '20251117_093519', file: '20251117_093519.mp4', title: 'NOVO-LAB_E1_SA-DE_T06' },
      { id: '20251117_093829', file: '20251117_093829.mp4', title: 'NOVO-LAB_E1_SA-ED_T07' },
      { id: '20251117_094257', file: '20251117_094257.mp4', title: 'NOVO-LAB_E1_SA-DE_T08' },
      { id: '20251117_094551', file: '20251117_094551.mp4', title: 'NOVO-LAB_E1_SA-ED_T09' },
      { id: '20251117_094811', file: '20251117_094811.mp4', title: 'NOVO-LAB_E1_SA-DE_T10' },
      { id: '20251117_095035', file: '20251117_095035.mp4', title: 'NOVO-LAB_E1_SA-ED_T11' },
      { id: '20251117_095100', file: '20251117_095100.mp4', title: 'NOVO-LAB_E1_SA-DE_T12' },
      { id: '20251117_095330', file: '20251117_095330.mp4', title: 'NOVO-LAB_E1_SA-ED_T13' },
      { id: '20251117_102849', file: '20251117_102849.mp4', title: 'NOVO-LAB_E1_CA-ED_T01' },
      { id: '20251117_103206', file: '20251117_103206.mp4', title: 'NOVO-LAB_E1_CA-DE_T02' },
      { id: '20251117_103507', file: '20251117_103507.mp4', title: 'NOVO-LAB_E1_CA-ED_T03' },
      { id: '20251117_104013', file: '20251117_104013.mp4', title: 'NOVO-LAB_E1_CA-DE_T04' },
      { id: '20251117_104439', file: '20251117_104439.mp4', title: 'NOVO-LAB_E1_CA-ED_T05' },
      { id: '20251117_105014', file: '20251117_105014.mp4', title: 'NOVO-LAB_E1_CA-DE_T06' },
      { id: '20251117_105304', file: '20251117_105304.mp4', title: 'NOVO-LAB_E1_CA-ED_T07' },
      { id: '20251117_105923', file: '20251117_105923.mp4', title: 'NOVO-LAB_E1_CA-DE_T08' },
      { id: '20251117_110125', file: '20251117_110125.mp4', title: 'NOVO-LAB_E1_CA-ED_T09' },
      { id: '20251117_110406', file: '20251117_110406.mp4', title: 'NOVO-LAB_E1_CA-DE_T10' },
      { id: '20251117_113702', file: '20251117_113702.mp4', title: 'NOVO-LAB_E4_ED_T01' },
      { id: '20251117_113715', file: '20251117_113715.mp4', title: 'NOVO-LAB_E4_DE_T02' },
      { id: '20251117_114144', file: '20251117_114144.mp4', title: 'NOVO-LAB_E4_ED_T03' },
      { id: '20251117_114419', file: '20251117_114419.mp4', title: 'NOVO-LAB_E4_DE_T04' },
      { id: '20251117_115010', file: '20251117_115010.mp4', title: 'NOVO-LAB_E4_ED_T05' },
      { id: '20251117_115334', file: '20251117_115334.mp4', title: 'NOVO-LAB_E4_DE_T06' },
      { id: '20251117_115649', file: '20251117_115649.mp4', title: 'NOVO-LAB_E4_ED_T07' },
      { id: '20251117_120032', file: '20251117_120032.mp4', title: 'NOVO-LAB_E4_DE_T08' },
      { id: '20251117_120600', file: '20251117_120600.mp4', title: 'NOVO-LAB_E4_ED_T09' },
      { id: '20251117_120923', file: '20251117_120923.mp4', title: 'NOVO-LAB_E4_DE_T10' },
      { id: '20251117_121227', file: '20251117_121227.mp4', title: 'NOVO-LAB_E4_ED_T11' },
      { id: '20251117_122154', file: '20251117_122154.mp4', title: 'NOVO-LAB_E4_DE_T12' },
    ];

    const select = document.getElementById('video-select');
    const list = document.getElementById('gallery-list');
    const player = document.getElementById('main-player');
    const title = document.getElementById('video-title');

    if(videos.length > 0) {
        videos.forEach((item, index) => {
          const opt = document.createElement('option');
          opt.value = item.id;
          opt.textContent = `${index + 1}. ${item.title}`;
          select.appendChild(opt);

          const li = document.createElement('li');
          li.className = 'video-card';
          li.id = 'card-' + item.id;
          li.onclick = () => trocarVideo(item.id);
          li.innerHTML = `<h4>${index + 1}. ${item.title}</h4>`;
          list.appendChild(li);
        });

        function trocarVideo(id) {
          const item = videos.find(v => v.id === id) || videos[0];
          if (!item) return;

          window.location.hash = item.id;
          select.value = item.id;
          title.textContent = item.title;
          player.src = item.file;
          player.load();
          window.scrollTo({ top: 0, behavior: 'smooth' });

          document.querySelectorAll('.video-card').forEach(el => el.classList.remove('active'));
          const activeCard = document.getElementById('card-' + item.id);
          if (activeCard) activeCard.classList.add('active');
        }

        window.addEventListener('DOMContentLoaded', () => {
          const initialId = window.location.hash.replace('#', '');
          trocarVideo(initialId);
        });

        window.addEventListener('hashchange', () => {
          const hashId = window.location.hash.replace('#', '');
          trocarVideo(hashId);
        });
    } else {
        title.textContent = "Erro: Nenhum vídeo configurado corretamente.";
    }
  </script>
</body>
</html>
