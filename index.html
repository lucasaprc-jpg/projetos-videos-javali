<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vídeos de Teste - Módulo do Javali</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 960px; margin: 30px auto; padding: 0 20px; background: #0d1117; color: #c9d1d9; }
    h1 { border-bottom: 1px solid #30363d; padding-bottom: 12px; font-size: 1.6rem; }
    .player-container { background: #161b22; padding: 20px; border-radius: 8px; border: 1px solid #30363d; margin-bottom: 25px; }
    #video-title { color: #58a6ff; margin-top: 0; font-size: 1.3rem; }
    video { width: 100%; border-radius: 6px; background: #000; outline: none; margin-top: 10px; }
    .selector-box { margin-bottom: 15px; }
    select { width: 100%; padding: 10px; background: #21262d; color: #c9d1d9; border: 1px solid #30363d; border-radius: 6px; font-size: 1rem; cursor: pointer; }
    .video-list { list-style: none; padding: 0; margin: 20px 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; }
    .video-item { background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 12px; cursor: pointer; transition: 0.2s; }
    .video-item:hover, .video-item.active { border-color: #58a6ff; background: #1f242c; }
    .video-item a { color: #c9d1d9; text-decoration: none; display: block; font-weight: 500; font-size: 0.95rem; }
    .video-item.active a { color: #58a6ff; }
  </style>
</head>
<body>
  <h1>🐗 Testes do Módulo do Javali</h1>

  <div class="player-container">
    <div class="selector-box">
      <label for="video-select" style="font-weight: 600; display: block; margin-bottom: 6px;">Selecione o ensaio/teste:</label>
      <select id="video-select" onchange="trocarVideo(this.value)">
      </select>
    </div>
    <h2 id="video-title">Carregando...</h2>
    <video id="main-player" controls preload="metadata"></video>
  </div>

  <h2>Todos os Ensaios Disponíveis</h2>
  <ul class="video-list" id="gallery-list"></ul>

  <script>
    let videos = [];

    videos = [
    ];

    const select = document.getElementById('video-select');
    const list = document.getElementById('gallery-list');
    const player = document.getElementById('main-player');
    const title = document.getElementById('video-title');

    videos.forEach((item, index) => {
      // Preenche o Select
      const opt = document.createElement('option');
      opt.value = item.id;
      opt.textContent = `${index + 1}. ${item.title}`;
      select.appendChild(opt);

      // Preenche a Lista de cartões
      const li = document.createElement('li');
      li.className = 'video-item';
      li.id = 'card-' + item.id;
      li.innerHTML = `<a href="#${item.id}" onclick="trocarVideo('${item.id}')">${index + 1}. ${item.title}</a>`;
      list.appendChild(li);
    });

    function trocarVideo(id) {
      const item = videos.find(v => v.id === id) || videos[0];
      if (!item) return;

      window.location.hash = item.id;
      select.value = item.id;
      title.textContent = item.title;
      player.src = item.file;
      player.load();

      document.querySelectorAll('.video-item').forEach(el => el.classList.remove('active'));
      const activeCard = document.getElementById('card-' + item.id);
      if (activeCard) activeCard.classList.add('active');
    }

    // Carrega o vídeo solicitado pela URL (ou o primeiro da fila)
    window.addEventListener('DOMContentLoaded', () => {
      const initialId = window.location.hash.replace('#', '');
      trocarVideo(initialId);
    });

    window.addEventListener('hashchange', () => {
      const hashId = window.location.hash.replace('#', '');
      trocarVideo(hashId);
    });
  </script>
</body>
</html>
